name: Build EdgeTX firmware

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EdgeTX/edgetx
          ref: main
      - name: Checkout patch script
        uses: actions/checkout@v4
        with:
          repository: samatov1806/edgetx
          ref: main
          path: mypatch
      - name: Apply USB CRSF patch
        run: python3 mypatch/.github/workflows/apply_patch.py
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-arm-none-eabi cmake build-essential
      - name: Build TX16S MK3
        run: |
          mkdir -p build && cd build
          cmake ../radio/src -DPCB=TX16S -DPCBREV=MK3 -DDEFAULT_MODE=2
          make firmware -j$(nproc)
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: edgetx-tx16smk3-crsf-usb
          path: build/firmware.bin